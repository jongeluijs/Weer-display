<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#07101f" />
    <title>Weer Eindhoven</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <main class="dial" id="dial">
      <nav class="tabs" role="tablist">
        <button type="button" class="tab" data-view="history" role="tab">Historie</button>
        <button type="button" class="tab active" data-view="today" role="tab">Vandaag</button>
        <button type="button" class="tab" data-view="forecast" role="tab">Komende</button>
      </nav>
      <button type="button" id="warning-btn" class="warning-btn" aria-label="Weerwaarschuwing" title="Weerwaarschuwing">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M12 3 L22 21 L2 21 Z" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <rect x="11" y="9" width="2" height="6" rx="1" fill="currentColor"/>
          <circle cx="12" cy="18" r="1.2" fill="currentColor"/>
        </svg>
      </button>
      <div class="stage">
        <section id="view-today" class="view active" role="tabpanel"></section>
        <section id="view-forecast" class="view" role="tabpanel"></section>
        <section id="view-history" class="view" role="tabpanel"></section>
        <div id="alert-banner" class="alert" hidden>
          <button type="button" class="alert-close" aria-label="Sluiten">&times;</button>
          <strong id="alert-title"></strong>
          <span id="alert-text"></span>
        </div>
        <div id="temp-chart-modal" class="modal-overlay" hidden>
          <div class="modal-card">
            <button type="button" class="modal-close" aria-label="Sluiten">&times;</button>
            <strong class="modal-title">Temperatuurverloop</strong>
            <div class="modal-body" id="temp-chart-body"></div>
          </div>
        </div>
        <div id="sun-chart-modal" class="modal-overlay" hidden>
          <div class="modal-card">
            <button type="button" class="modal-close" aria-label="Sluiten">&times;</button>
            <strong class="modal-title">Zonnekracht &amp; UV-index</strong>
            <div class="modal-body" id="sun-chart-body"></div>
          </div>
        </div>
      </div>
      <footer class="meta">
        <span id="clock">--:--</span>
        <span class="sep">•</span>
        <span id="location">Eindhoven</span>
        <span class="sep">•</span>
        <span id="last-update">—</span>
      </footer>
    </main>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
